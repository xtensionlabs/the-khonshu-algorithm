[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khonshu-algorithm"
version = "0.1.0"
description = "ROS-independent path planning core for Strathmore Racing FS-AI DDT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "icecream>=2,<3",
    "numba>=0.59,<1",
    "numpy>=1.25,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "typing_extensions>=4.8,<5",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["khonshu*", "fsd_path_planning*"]
namespaces = true

[tool.setuptools.package-data]
fsd_path_planning = ["**/*.json", "**/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["integration: calls the vendored end-to-end path planner"]
